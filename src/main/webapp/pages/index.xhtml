<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:jsf="jakarta.faces"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Gestor de Gastos Personales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
    </style>
</h:head>

<h:body>
    <div class="welcome-container">
        <div class="logo">💰</div>
        <h1>Gestor de Gastos Personales</h1>
        <p class="subtitle">Controla tus finanzas de forma inteligente</p>

        <div class="button-group">
            <p:button value="Iniciar Sesión"
                      outcome="/pages/login.xhtml"
                      icon="pi pi-sign-in"
                      styleClass="ui-button-success"
                      style="width: 180px; height: 50px;"/>

            <p:button value="Crear Cuenta"
                      outcome="/pages/register.xhtml"
                      icon="pi pi-user-plus"
                      styleClass="ui-button-info"
                      style="width: 180px; height: 50px;"/>
        </div>
    </div>
</h:body>
</html>
